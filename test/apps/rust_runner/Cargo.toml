[package]
name = "rust_runner"
version = "0.1.0"
edition = "2021"

[dependencies]
flezha_runner = { path = "../../../sdk/rust" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
erased-serde="0.4.6"

[dev-dependencies]
# Enables `flezha_runner::testing::ShardTestHarness` for the macro-twin
# equivalence tests in `src/main.rs`.
flezha_runner = { path = "../../../sdk/rust", features = ["testing"] }