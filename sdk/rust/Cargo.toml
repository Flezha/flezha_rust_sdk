[package]
name = "flezha_runner"
version = "0.1.0"
edition = "2021"

# The `no_run` example in src/lib.rs is illustrative documentation; the
# workspace-wide `cargo test` collects two `flz_transport` metadata
# files in `target/debug/deps` (one from flz_nif's cdylib build, one
# from flezha_runner's rlib dep) and the doctest's separate compile
# step intermittently picks the wrong one, surfacing as `E0460: found
# possibly newer version of crate flz_transport`. Disable doctest
# collection here so the workspace test is stable; the example still
# compiles on demand via `cargo test --doc -p flezha_runner` against
# a clean dep dir.
[lib]
doctest = false

[features]
default = []
# Exposes internal dispatch types (mailbox, work-stealing pool, registry
# constructors) for the crate's own benches/tests. NOT a stable public API.
# Only enabled by the `[[bench]]` targets via `required-features`.
bench-internals = []
# Exposes `flezha_runner::testing::OperationTestHarness` for downstream
# crates that want to write replay-equality tests. Test code in this crate
# also compiles the surface under `cfg(test)` regardless of the feature.
testing = []

[dependencies]
flz_transport = { path = "../../flz_transport" }
flezha-macros = { path = "../../flezha-macros" }
# Compile-time operative collection for the single-operation auto-wire path.
# Operatives generated by `#[flezha::operation]` / `flezha::operative!` `submit!`
# themselves into this set; `register_inventory_operatives()` harvests it at startup.
inventory = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4.0"
erased-serde = "0.4.6"
prost = "0.13.5"
crossbeam = "0.8"
thiserror = "1.0"
mio = { version = "0.8.11", features = ["os-poll", "os-ext", "net"] }
dashmap = "6"
crossbeam-deque = "0.8"
# SIGTERM trap for the SDK's graceful-shutdown handler. Default features
# (channel + iterator) are sufficient — we use `Iterator` to block on
# delivered signals from a dedicated handler thread.
signal-hook = "0.3"
# State persistence: postcard for change/state encoding (deterministic,
# already a transitive dep via flz_transport's framing path); crc32fast
# for the 16-byte header CRC; tracing for the wire-stub's trace events.
postcard = { version = "1.0", features = ["use-std"] }
crc32fast = "1.4"
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
erased-serde = "0.4.6"
trybuild = "1.0"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[[bench]]
name = "dispatch"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "correctness"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "state"
harness = false

[[bench]]
name = "hybrid_channel_throughput"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "dynamic_segment_steady_state"
harness = false
required-features = ["bench-internals"]

[[test]]
name = "operative_dispatch"
required-features = ["bench-internals"]

[[test]]
name = "dlq_retry"
required-features = ["bench-internals"]

[[test]]
name = "operative_topology"
required-features = ["bench-internals"]

[[test]]
name = "state_serialize"
required-features = ["bench-internals"]

[[test]]
name = "hybrid_channel"
required-features = ["bench-internals"]

[[test]]
name = "dynamic_segment"
required-features = ["bench-internals"]

[[test]]
name = "merged_input"
required-features = ["bench-internals"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(loom)"] }
