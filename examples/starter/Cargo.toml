# Standalone: no workspace, and the SDK named by its released version, so this
# builds the way your own project does.
[package]
name = "starter"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
flezha_runner = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
flezha_runner = { version = "0.1.0", features = ["testing"] }

# Its own workspace, so a workspace around this folder does not claim it.
[workspace]
