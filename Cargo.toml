[package]
name = "flezha_runner"
version = "0.1.0"
edition = "2021"
description = "Flezha Rust SDK — author flow and steps relays and run them against a Flezha controller"
license = "Apache-2.0"
repository = "https://github.com/flezha/flezha_rust_sdk"

# The `no_run` example in src/lib.rs is illustrative documentation; the
# workspace-wide `cargo test` collects two `flz_transport` metadata
# files in `target/debug/deps` (one from flz_nif's cdylib build, one
# from flezha_runner's rlib dep) and the doctest's separate compile
# step intermittently picks the wrong one, surfacing as `E0460: found
# possibly newer version of crate flz_transport`. Disable doctest
# collection here so the workspace test is stable; the example still
# compiles on demand via `cargo test --doc -p flezha_runner` against
# a clean dep dir.
[lib]
doctest = false

[features]
default = []
# Exposes internal dispatch types (mailbox, dispatch handle, registry
# constructors) for the crate's own benches/tests, and the shared bench
# scaffolding in `flz_core::bench_support`. NOT a stable public API.
# Only enabled by the `[[bench]]` and `[[test]]` targets via `required-features`.
bench-internals = ["flz_core/bench-internals"]
# Exposes `flezha_runner::testing::TaskletTestHarness` for downstream
# crates that want to write replay-equality tests. Test code in this crate
# also compiles the surface under `cfg(test)` regardless of the feature.
testing = []
# `derive_schema()` on a channel handle: the channel's JSON Schema in the
# relay's API, derived from a type implementing `schemars::JsonSchema`.
schemars = ["dep:schemars"]

[dependencies]
# The core at the tag this SDK is proven against. The core's own tree builds this
# crate as a member of its workspace, whose `[patch]` maps this source back to
# its path crates, so the same line works in both places.
flz_core = { git = "https://github.com/flezha/flezha", tag = "v0.1.0" }
flz_transport = { git = "https://github.com/flezha/flezha", tag = "v0.1.0" }
flezha-macros = { path = "macros" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1", optional = true }
lazy_static = "1.4.0"
erased-serde = "0.4.6"
prost = "0.13.5"
crossbeam = "0.8"
thiserror = "1.0"
mio = { version = "0.8.11", features = ["os-poll", "os-ext", "net"] }
dashmap = "6"
crossbeam-deque = "0.8"
# SIGTERM trap for the SDK's graceful-shutdown handler. Default features
# (channel + iterator) are sufficient — we use `Iterator` to block on
# delivered signals from a dedicated handler thread.
signal-hook = "0.3"
# State persistence: postcard for change/state encoding (deterministic,
# already a transitive dep via flz_transport's framing path); crc32fast
# for the 16-byte header CRC; tracing for the wire-stub's trace events.
postcard = { version = "1.0", features = ["use-std"] }
crc32fast = "1.4"
tracing = "0.1"
# Backs `diag::init_default_tracing` (EnvFilter + fmt subscriber).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
flz_core = { git = "https://github.com/flezha/flezha", tag = "v0.1.0", features = ["test-support"] }
criterion = { version = "0.5", features = ["html_reports"] }
erased-serde = "0.4.6"
trybuild = "1.0"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

