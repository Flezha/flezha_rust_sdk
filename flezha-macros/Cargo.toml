[package]
name = "flezha-macros"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for the Flezha Rust SDK"
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
