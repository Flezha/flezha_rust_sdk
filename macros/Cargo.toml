[package]
name = "flezha-macros"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for the Flezha Rust SDK"
license = "Apache-2.0"
repository = "https://github.com/flezha/flezha_rust_sdk"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(loom)"] }

[lints.clippy]
cognitive_complexity = "warn"
